version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
          disabled: true # template code: don't force doc comments on every export

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Mrf-LuckyBoy/go-hexagonal-minimal-template
